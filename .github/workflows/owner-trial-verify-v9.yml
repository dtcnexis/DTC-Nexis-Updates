name: OWNER-only v9 signed catalog verification (NO PUBLIC RELEASE)
on:
  push:
    branches:
      - owner-test-batch01-20261018
    paths:
      - owner-tests/batch01/catalog-v9.json
      - owner-tests/batch01/update-feed-v9-candidate.json
      - .github/workflows/owner-trial-verify-v9.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  validate-unsigned-transport-signed-content:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {persist-credentials: false}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Install minimal P-256 verifier
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Audit trial v9 SHA256, authenticity and preserve old codes
        shell: bash
        run: |
          python - <<'PY'
          import base64,hashlib,json,pathlib,re
          from cryptography.hazmat.primitives import hashes
          from cryptography.hazmat.primitives.asymmetric import ec,utils
          d=pathlib.Path('owner-tests/batch01')
          key=json.loads((d/'public-key.jwk.json').read_text(encoding='utf8'))
          def dec(x):return base64.urlsafe_b64decode(x+'='*((-len(x))%4))
          pub=ec.EllipticCurvePublicNumbers(int.from_bytes(dec(key['x']),'big'),int.from_bytes(dec(key['y']),'big'),ec.SECP256R1()).public_key()
          def check(src):
              feed=json.loads((d/src).read_text(encoding='utf8'))
              payload=base64.b64decode(feed['payload'],validate=True)
              sig=base64.b64decode(feed['signature'],validate=True)
              assert len(sig)==64
              pub.verify(utils.encode_dss_signature(int.from_bytes(sig[:32],'big'),int.from_bytes(sig[32:],'big')),payload,ec.ECDSA(hashes.SHA256()))
              return json.loads(payload)
          old=check('update-feed.json')
          new=check('update-feed-v9-candidate.json')
          assert old['app']==new['app']=='DTCNexis'
          assert old['versionCode']==new['versionCode']==7
          assert old['catalog']['versionCode']==8
          assert new['catalog']['versionCode']==9
          url='https://raw.githubusercontent.com/dtcnexis/DTC-Nexis-Updates/owner-test-batch01-20261018/owner-tests/batch01/catalog-v9.json'
          assert new['catalog']['url']==url
          raw=(d/'catalog-v9.json').read_bytes()
          assert new['catalog']['sha256']==hashlib.sha256(raw).hexdigest()
          assert new['catalog']['sha256']=='431b89583064acbeb6b13ee06a83669011ed8c6566959dbb73697830e5d3d03c'
          v8=json.loads((d/'catalog.json').read_text(encoding='utf8'))
          v9=json.loads(raw)
          assert v8['versionCode']==8 and v9['versionCode']==9
          assert len(v8['items'])==10 and len(v9['items'])==18
          assert v8['items']==v9['items'][:10],'old code changed; must preserve'
          codes=[r['code'] for r in v9['items']]
          assert len(codes)==len(set(codes))
          for row in v9['items']:
              assert re.fullmatch('[PBCU][0-9A-F]{4}',row['code'])
              assert row['code'][0]==row['system']
              assert set(row)=={'code','system','en','ar','sv','source'}
              assert all(isinstance(row[k],str) and row[k] and len(row[k])<=250 for k in ['en','ar','sv','source'])
          assert len(raw)<=2*1024*1024
          assert not new.get('windows') and not new.get('android') and not new.get('ios')
          print('PASS: v8 -> v9 signed feed key pinned, v9 content SHA256 correct')
          print('PASS: 18 generic DTC records with 8 additions and all v8 content preserved')
          print('PASS: no binary upgrade, no image transport and main feed untouched')
          PY
