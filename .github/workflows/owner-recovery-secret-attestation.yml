name: RC382 owner recovery signer identity proof (ISOLATED NO PUBLISH)

on:
  push:
    branches:
      - test/rc382-guide-photoreal-review-20261021
    paths:
      - ci/owner_recovery_secret_attestation.py
      - .github/workflows/owner-recovery-secret-attestation.yml
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-signer-in-memory-only:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - name: Checkout isolated testing branch, no persisted credential
        uses: actions/checkout@v4
        with:
          persist-credentials: false
      - name: Set up isolated Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install only cryptographic verifier
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Prove the actual existing recovery Secret matches the pinned public key (NO RELEASE)
        shell: bash
        env:
          NEXIS_OWNER_RECOVERY_SIGNER_KEY_PEM: ${{ secrets.NEXIS_OWNER_RECOVERY_SIGNER_KEY_PEM }}
        run: |
          set -euo pipefail
          set +x
          python ci/owner_recovery_secret_attestation.py
          echo "PASS: existing recovery Secret cryptographically matched owner-approved public key." >> "$GITHUB_STEP_SUMMARY"
          echo "Signed synthetic non-installable bytes in runner memory only; no owner channel, files or artifacts changed." >> "$GITHUB_STEP_SUMMARY"
      - name: Preserve all publication blocks
        if: always()
        shell: bash
        run: |
          echo "No release, no Update feed revision change, no Windows installer, no private key export." >> "$GITHUB_STEP_SUMMARY"
          echo "Do not activate R10 or install Windows software before separately trusted bootstrap and owner approval." >> "$GITHUB_STEP_SUMMARY"
