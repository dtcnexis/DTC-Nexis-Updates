name: Recovery signer availability gate (NO PUBLISH)

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  recovery-secret-availability:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm recovery signer secret exists without reading its contents
        env:
          RECOVERY_CONFIGURED: ${{ secrets.NEXIS_OWNER_RECOVERY_SIGNER_KEY_PEM != '' }}
          LEGACY_CONFIGURED: ${{ secrets.NEXIS_OWNER_TRIAL_SIGNER_KEY_PEM != '' }}
        shell: bash
        run: |
          if [[ "$RECOVERY_CONFIGURED" != "true" ]]; then
            echo "FAIL: recovery signer secret not configured"
            exit 1
          fi
          echo "PASS: recovery signer secret configured (content never displayed)"
          echo "Legacy signer available: $LEGACY_CONFIGURED"
          echo "NO SIGNING. NO PUBLISH. NO FEED CHANGES."
      - name: Confirm staging-only branch
        env:
          REF_NAME: ${{ github.ref_name }}
        run: |
          test "$REF_NAME" = "test/rc382-recovery-signer-qa-20261019"
          echo "PASS: isolated recovery test branch"
