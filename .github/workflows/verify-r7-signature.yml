name: Verify unsigned R7 is blocked (no publishing)
on:
  push:
    branches: [fix/r7-authenticode-release-gate-20261018]
    paths:
      - 'ci/**'
      - '.github/workflows/**'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  verify-r7-blocker:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - name: Validate candidate release publisher parses and enforces the gate
        shell: pwsh
        run: |
          python -m py_compile ci/publish_release.py
          if ($LASTEXITCODE -ne 0) { throw 'Publisher syntax validation failed' }
          $source = Get-Content ci/publish_release.py -Raw
          $workflow = Get-Content .github/workflows/publish-windows.yml -Raw
          $gate = $source.IndexOf('verify-windows-installer-signature.ps1')
          $publish = $source.IndexOf("gh('release','create'")
          if ($gate -lt 0 -or $publish -lt 0 -or $gate -ge $publish) { throw 'BLOCK: publisher can upload before signature verification' }
          if (!$source.Contains("if os.name != 'nt'")) { throw 'BLOCK: publisher does not require Windows verification' }
          if (!$workflow.Contains('runs-on: windows-latest')) { throw 'BLOCK: release publisher is not on Windows' }
          if (!$workflow.Contains('./ci/verify-windows-installer-signature.ps1 -Installer $installer')) { throw 'BLOCK: installed-update test lacks signature verification' }
      - name: Download historical R7 installer
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release download v7 --repo dtcnexis/DTC-Nexis-Updates --pattern "DTC_NEXIS_SETUP_R7.exe" --dir "$env:RUNNER_TEMP"
          if ($LASTEXITCODE -ne 0 -or !(Test-Path "$env:RUNNER_TEMP/DTC_NEXIS_SETUP_R7.exe")) { throw 'Historical release asset not found' }
      - name: Verify historical R7 bytes have expected SHA-256
        shell: pwsh
        run: |
          $expected = 'D5D7E48243EC40C57B8AF5D618130F47A0CBF00139D6B8FC1CDD9FB4895DF2C6'
          $actual = (Get-FileHash -LiteralPath "$env:RUNNER_TEMP/DTC_NEXIS_SETUP_R7.exe" -Algorithm SHA256).Hash
          if ($actual -ne $expected) { throw "BLOCK: historical R7 hash mismatch: $actual" }
          Write-Host 'PASS: checked historical R7 bytes'
      - name: Assert untrusted R7 cannot pass the release gate
        shell: pwsh
        run: |
          $installer = "$env:RUNNER_TEMP/DTC_NEXIS_SETUP_R7.exe"
          try {
            ./ci/verify-windows-installer-signature.ps1 -Installer $installer
            throw 'FAIL: historical R7 unexpectedly passed the signing release gate'
          } catch {
            if ($_.Exception.Message -notmatch 'BLOCK RELEASE:') { throw }
            Write-Host "PASS: unsigned or invalid historical R7 refused: $($_.Exception.Message)"
          }
