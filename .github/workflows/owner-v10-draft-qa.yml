name: PRIVATE OWNER Revision 10 draft QA (NO PUBLISH)
on:
  push:
    branches:
      - owner-stable-data-channel
    paths:
      - owner-channel/review/catalog-v10-unsigned.json
      - owner-channel/update-feed.json
      - ci/check_owner_v10_candidate.py
      - .github/workflows/owner-v10-draft-qa.yml
  workflow_dispatch:
permissions:
  contents: read
jobs:
  review-only:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install public-key verifier only
        run: python -m pip install --disable-pip-version-check cryptography==46.0.4
      - name: Validate original signed v9 and isolated unsigned v10 draft
        run: python ci/check_owner_v10_candidate.py
      - name: Record blocked release boundary
        if: always()
        run: |
          echo 'OWNER-ONLY QA: no production signing, no Revision 10 feed activation, no OEM photos, no release or deployment.' >> "$GITHUB_STEP_SUMMARY"
